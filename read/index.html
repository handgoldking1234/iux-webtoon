<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>웹툰보드 연재</title>
<meta name="description" content="웹툰보드에서 만든 웹툰을 요일연재 · 자유연재로 읽는 곳">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 독자용 연재관 — 위 고정 메뉴, 요일 탭 + 3:4 썸네일 격자, 작품 · 세로 뷰어 · 연재하기 단계 화면을 #주소로 바꿔 보여 줘요 */
:root{
  --bg:#f5f6f4;--surface:#ffffff;--ink:#151916;--ink-2:#626a64;--ink-3:#959c97;--line:#e3e6e2;
  --green:#16a34a;--green-soft:#e6f6ec;--on-green:#ffffff;--red:#e5484d;--amber:#f5a524;--blue:#3d6fd1;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1210;--surface:#161b18;--ink:#eef1ee;--ink-2:#a6aea8;--ink-3:#727a74;--line:#262d29;--green:#22c55e;--green-soft:#123221;--on-green:#05200e;--red:#f2555a;--amber:#f5b54a;--blue:#7ea4f0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1210;--surface:#161b18;--ink:#eef1ee;--ink-2:#a6aea8;--ink-3:#727a74;--line:#262d29;--green:#22c55e;--green-soft:#123221;--on-green:#05200e;--red:#f2555a;--amber:#f5b54a;--blue:#7ea4f0;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body);-webkit-font-smoothing:antialiased;word-break:keep-all}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
img,canvas{display:block;max-width:100%}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.muted{color:var(--ink-2)}
.tnum{font-variant-numeric:tabular-nums}

/* 상단 */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.gnb{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.gnb .wrap{display:flex;align-items:center;gap:18px;height:58px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:21px;letter-spacing:-.01em;white-space:nowrap}
.logo i{width:28px;height:28px;border-radius:50%;background:var(--green);display:grid;place-items:center}
.logo svg{width:15px;height:15px;stroke:var(--on-green)}
.logo small{font-family:var(--f-body);font-size:12px;font-weight:700;color:var(--green);margin-left:2px;align-self:flex-start;margin-top:4px}
.menu{display:flex;gap:2px;height:100%}
.menu a{display:flex;align-items:center;padding:0 12px;font-weight:700;color:var(--ink-2);border-bottom:3px solid transparent;margin-bottom:-1px}
.menu a.on{color:var(--ink);border-bottom-color:var(--green)}
.gnb .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.btn.go{background:var(--green);border-color:var(--green);color:var(--on-green)}
.btn.big{padding:13px 22px;font-size:15px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.only-wide{display:inline-flex}
@media (max-width:760px){
  .gnb .wrap{height:auto;flex-wrap:wrap;gap:0 12px;padding-block:8px 0}
  .menu{order:3;width:100%;height:44px;overflow-x:auto}
  .menu a{padding:0 10px}
  .only-wide{display:none}
}

/* 홈 */
.feature{margin-top:22px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);border-radius:16px;overflow:hidden;background:#141a17;color:#f2f4f2;min-height:260px}
.feature .art{position:relative;min-height:220px}
.feature .art canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.feature .txt{padding:30px 30px 28px;display:grid;gap:12px;align-content:center}
.feature .tag{font-size:12px;font-weight:700;color:#7ee2a3;letter-spacing:.06em}
.feature h2{font-family:var(--f-display);font-weight:400;font-size:38px;line-height:1.15}
.feature p{color:#c3cbc6}
.feature .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.feature .btn{background:transparent;border-color:#4a554f;color:#f2f4f2}
.feature .btn.go{background:#22c55e;border-color:#22c55e;color:#05200e}
@media (max-width:760px){.feature{grid-template-columns:1fr}.feature .txt{padding:22px}.feature h2{font-size:30px}}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;margin-top:30px;align-items:start}
.layout>*{min-width:0}
@media (max-width:980px){.layout{grid-template-columns:1fr}}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.sec-h h2{font-size:20px}
.sec-h a{margin-left:auto;font-size:13px;color:var(--ink-2)}
.days{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;margin-bottom:16px}
.days button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;color:var(--ink-2)}
.days button.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.days button .today{font-size:11px;color:var(--green);margin-left:3px}
.days button.on .today{color:#7ee2a3}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px 14px}
@media (max-width:1180px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:760px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 10px}}
/* 홈의 한 줄 목록은 좁은 화면에서 옆으로 넘겨 봐요 */
@media (max-width:1180px){.grid.swipe{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:calc((100% - 3*14px)/4.3);overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:none}.grid.swipe::-webkit-scrollbar{display:none}.grid.swipe>*{scroll-snap-align:start}}
@media (max-width:760px){.grid.swipe{grid-auto-columns:calc((100% - 2*10px)/3.3)}}
.card{display:grid;gap:7px;min-width:0}
.card .th{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--line);max-width:100%}
.card .th canvas{width:100%;height:100%}
.badges{position:absolute;left:6px;top:6px;display:flex;gap:4px}
.bd{font-size:10.5px;font-weight:700;line-height:1;padding:4px 6px;border-radius:5px;background:rgba(10,12,11,.72);color:#fff}
.bd.up{background:var(--red)}
.bd.new{background:var(--green);color:var(--on-green)}
.bd.ai{background:rgba(255,255,255,.9);color:#151916}
.card b{font-size:14.5px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .meta{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--ink-2);min-width:0}
.card .meta span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.star{color:var(--amber);font-weight:700;flex:none}
.empty{padding:40px 0;text-align:center;color:var(--ink-2)}

.side{display:grid;gap:22px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.rank{list-style:none;margin:0;padding:0;display:grid;gap:4px;counter-reset:r}
.rank-wide{display:block;columns:2;column-gap:28px}
.rank-wide li,.side .rank li{break-inside:avoid;margin-bottom:4px}
@media (min-width:600px) and (max-width:980px){.side .rank{display:block;columns:2;column-gap:28px}.side .rank li{break-inside:avoid}.side{grid-template-columns:minmax(0,1fr)}}
@media (max-width:599px){.rank-wide{columns:1}}
.rank li a{display:grid;grid-template-columns:22px 44px minmax(0,1fr);gap:10px;align-items:center;padding:6px 0}
.rank .n{font-weight:700;font-size:16px;text-align:center}
.rank li:nth-child(-n+3) .n{color:var(--green)}
.rank .mini{width:44px;aspect-ratio:3/4;border-radius:6px;overflow:hidden}
.rank .mini canvas{width:100%;height:100%}
.rank b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank small{color:var(--ink-2);font-size:12px}
.make{background:var(--green-soft);border-color:transparent;display:grid;gap:10px}
.make h3{font-size:16px}
.make p{font-size:13.5px;color:var(--ink-2)}
.tabs2{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs2 button{border:0;background:none;padding:8px 12px;font-weight:700;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs2 button.on{color:var(--ink);border-bottom-color:var(--ink)}
.notice{margin-top:12px;font-size:13px;color:var(--ink-2);display:flex;gap:6px;align-items:flex-start}

/* 작품 페이지 */
.thead{display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;padding-block:28px 22px;align-items:start}
.thead .th{aspect-ratio:3/4;border-radius:12px;overflow:hidden;max-width:100%}
.thead .th canvas{width:100%;height:100%}
.thead h1{font-family:var(--f-display);font-weight:400;font-size:36px;line-height:1.15}
.thead .who{margin-top:6px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 12px;font-size:14px}
.thead .desc{margin-top:14px;max-width:62ch}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.chip{font-size:12.5px;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}
.chip.ai{border-color:var(--blue);color:var(--blue)}
.thead .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.fav.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
@media (max-width:640px){.thead{grid-template-columns:96px minmax(0,1fr);gap:4px 16px;padding-block:20px 18px}.thead>div:last-child{display:contents}.thead .th{grid-row:1/3}.thead h1{font-size:26px;grid-column:2;grid-row:1;align-self:end}.thead .who{grid-column:2;grid-row:2;align-self:start}.thead .desc,.thead .chips,.thead .acts{grid-column:1/-1}.thead .desc{margin-top:16px}}
.eplist{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:40px}
.eplist .hd{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);font-size:14px}
.eplist .hd b{font-size:15px}
.eplist .hd button{margin-left:auto;border:0;background:none;color:var(--ink-2);font-size:13px}
.ep{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line)}
.ep:last-child{border-bottom:0}
.ep:hover{background:color-mix(in srgb,var(--bg) 60%,var(--surface))}
.ep .eth{aspect-ratio:16/10;border-radius:6px;overflow:hidden;max-width:100%}
.ep .eth canvas{width:100%;height:100%}
.ep b{display:block;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ep small{color:var(--ink-2);font-size:12.5px}
.ep .d{font-size:12.5px;color:var(--ink-3);text-align:right}
@media (max-width:520px){.ep{grid-template-columns:80px minmax(0,1fr)}.ep .d{display:none}}

/* 뷰어 */
.vbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--surface);border-bottom:1px solid var(--line)}
.vbar .wrap{display:flex;align-items:center;gap:10px;height:54px;max-width:820px}
.vbar .t{min-width:0;flex:1}
.vbar .t b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbar .t small{color:var(--ink-2);font-size:12.5px}
.ibtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.ibtn[disabled]{opacity:.35;cursor:not-allowed}
.strip{max-width:690px;margin:0 auto;background:#fff}
.cutv{position:relative}
.cutv canvas{width:100%;height:auto}
.bal{position:absolute;max-width:62%;background:#fff;color:#151916;border:2px solid #151916;border-radius:22px;padding:10px 16px;font-size:clamp(13px,2.4vw,17px);font-weight:500;line-height:1.45;text-align:center}
.bal.nar{border-radius:3px;background:#151916;color:#f2f2f2;border-color:#151916}
.bal.sh{border-width:3px;font-weight:700}
.after{max-width:722px;margin:0 auto;padding-block:26px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
.after>*{min-width:0}
.amsg{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;gap:4px}
.amsg small{color:var(--ink-2);font-weight:700;font-size:12.5px}
.rate{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:10px;justify-items:center;text-align:center}
.stars{display:flex;gap:4px}
.stars button{border:0;background:none;padding:2px;font-size:30px;line-height:1;color:var(--line)}
.stars button.on{color:var(--amber)}
.navep{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.navep a{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:2px;min-width:0}
.navep a small{color:var(--ink-2);font-size:12.5px}
.navep a b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navep a.next{text-align:right;border-color:var(--green)}
.navep a[aria-disabled="true"]{opacity:.4;pointer-events:none}
.cmts{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px}
.cmts,.amsg{grid-template-columns:minmax(0,1fr)}
.cmts form{display:flex;gap:8px;min-width:0}
.cmts input{width:0}
.cmts input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit}
.cmt{display:grid;gap:3px;padding-top:12px;border-top:1px solid var(--line)}
.cmt .h{display:flex;gap:8px;align-items:center;font-size:13px}
.cmt .h b{font-size:13.5px}
.cmt .best{font-size:11px;font-weight:700;color:var(--red);border:1px solid var(--red);border-radius:4px;padding:1px 5px}
.cmt .h span{color:var(--ink-3)}
.cmt .f{display:flex;gap:12px;font-size:12.5px;color:var(--ink-2)}
.cmt .f button{border:0;background:none;padding:0;color:var(--ink-2);font-size:12.5px}

/* 연재하기 */
.pub{max-width:860px;margin:0 auto;padding-block:28px 60px}
.pub h1{font-size:26px}
.steps{display:flex;gap:6px;margin:18px 0 22px;flex-wrap:wrap}
.steps span{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;color:var(--ink-3);padding:6px 12px 6px 6px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.steps span i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--ink-2);font-size:12px}
.steps span.on{color:var(--ink);border-color:var(--ink)}
.steps span.on i{background:var(--ink);color:var(--surface)}
.steps span.done i{background:var(--green);color:var(--on-green)}
@media (max-width:520px){.steps{flex-wrap:nowrap;gap:4px}.steps span:not(.on){padding-right:6px;font-size:0;gap:0}.steps span:not(.on) i{font-size:12px}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;display:grid;gap:18px}
.panel h2{font-size:18px}
.field{display:grid;gap:6px}
.field label,.field .lb{font-weight:700;font-size:14px}
.field small{color:var(--ink-2);font-size:12.5px}
.field input[type=text],.field textarea,.field select{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;width:100%}
.field textarea{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:640px){.two{grid-template-columns:1fr}.panel{padding:18px}}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:500;cursor:pointer;background:var(--bg)}
.seg input{accent-color:var(--green)}
.seg label:has(input:checked){border-color:var(--green);background:var(--green-soft)}
.src{display:grid;gap:10px}
.srcw{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;background:var(--bg)}
.srcw:has(input:checked){border-color:var(--green);background:var(--green-soft)}
.srcw .mini{aspect-ratio:3/4;border-radius:6px;overflow:hidden}
.srcw .mini canvas{width:100%;height:100%}
.srcw small{color:var(--ink-2);font-size:12.5px}
.eps{display:grid;gap:6px}
.eprow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.eprow input{accent-color:var(--green);width:18px;height:18px}
.eprow small{color:var(--ink-2)}
.chk{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.chk li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px;padding:10px 12px;border-radius:10px;background:var(--bg)}
.chk .ok{color:var(--green);font-weight:700}
.chk .warn{color:var(--amber);font-weight:700}
.chk i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--green-soft);color:var(--green)}
.chk i.w{background:color-mix(in srgb,var(--amber) 18%,transparent);color:var(--amber)}
.agree{display:grid;gap:8px}
.agree label{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.agree input{accent-color:var(--green);width:18px;height:18px;margin-top:2px;flex:none}
.pfoot{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.done{text-align:center;justify-items:center;padding-block:40px}
.done .bigck{width:64px;height:64px;border-radius:50%;background:var(--green);display:grid;place-items:center}
.done .bigck svg{width:30px;height:30px;stroke:var(--on-green);stroke-width:3}
.preview-card{width:160px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;z-index:50;pointer-events:none}
footer{border-top:1px solid var(--line);padding-block:24px 36px;color:var(--ink-3);font-size:12.5px;margin-top:20px}
footer .wrap{display:flex;gap:6px 18px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<header class="gnb" id="gnb">
  <div class="wrap">
    <a class="logo" href="/read" data-l=""><i><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg></i>웹툰보드<small>연재</small></a>

function rnd(seed){let s=0;for(const c of seed)s=(s*31+c.charCodeAt(0))>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
function motif(g,w,W2,H,r){const [a,b,c]=w.pal;g.save();
 if(w.motif==='rain'){g.strokeStyle='rgba(255,255,255,.14)';g.lineWidth=W2/240;for(let i=0;i<60;i++){const x=r()*W2*1.3,y=r()*H;g.beginPath();g.moveTo(x,y);g.lineTo(x-W2*.06,y+H*.22);g.stroke();}g.fillStyle=c;g.beginPath();g.arc(W2*.32,H*.62,W2*.13,0,7);g.fill();}
 else if(w.motif==='moon'){g.fillStyle=c;g.beginPath();g.arc(W2*.7,H*.28,W2*.16,0,7);g.fill();g.fillStyle=a;g.beginPath();g.arc(W2*.77,H*.24,W2*.15,0,7);g.fill();}
 else if(w.motif==='stars'){g.fillStyle=c;for(let i=0;i<40;i++){const x=r()*W2,y=r()*H*.7,s=r()*W2*.012+1;g.fillRect(x,y,s,s);}g.beginPath();g.arc(W2*.5,H*.42,W2*.2,0,7);g.globalAlpha=.85;g.fill();}
 else if(w.motif==='grid'){g.strokeStyle=b;g.globalAlpha=.55;g.lineWidth=W2/220;const n=9;for(let i=1;i<n;i++){g.beginPath();g.moveTo(W2*i/n,0);g.lineTo(W2*i/n,H);g.stroke();g.beginPath();g.moveTo(0,H*i/n);g.lineTo(W2,H*i/n);g.stroke();}g.globalAlpha=1;g.fillStyle=c;g.beginPath();g.arc(W2*4/9,H*4/9,W2*.06,0,7);g.fill();g.fillStyle=b;g.beginPath();g.arc(W2*5/9,H*5/9,W2*.06,0,7);g.fill();}
 else if(w.motif==='dots'){for(let i=0;i<26;i++){g.fillStyle=[b,c][i%2];g.globalAlpha=.75;g.beginPath();g.arc(r()*W2,r()*H,r()*W2*.07+W2*.02,0,7);g.fill();}}
 else if(w.motif==='waves'){g.strokeStyle=c;g.lineWidth=W2/60;g.globalAlpha=.8;for(let k=0;k<6;k++){g.beginPath();for(let x=0;x<=W2;x+=W2/40){const y=H*(.35+k*.1)+Math.sin(x/W2*12+k)*H*.02;x?g.lineTo(x,y):g.moveTo(x,y);}g.stroke();}}
 else if(w.motif==='rings'){g.strokeStyle=c;g.lineWidth=W2/70;for(let k=1;k<6;k++){g.globalAlpha=1-k*.15;g.beginPath();g.arc(W2*.5,H*.42,W2*.07*k,0,7);g.stroke();}}

 else if(w.motif==='lines'){g.strokeStyle=c;g.lineWidth=W2/80;for(let k=0;k<7;k++){g.globalAlpha=.3+k*.1;g.beginPath();g.moveTo(0,H*(.2+k*.08));g.lineTo(W2,H*(.1+k*.08));g.stroke();}}
 g.restore();}
function figure(g,x,y,s,col){g.fillStyle=col;g.beginPath();g.arc(x,y-s*1.25,s*.42,0,7);g.fill();g.beginPath();g.moveTo(x-s*.62,y+s*.9);g.quadraticCurveTo(x-s*.6,y-s*.7,x,y-s*.72);g.quadraticCurveTo(x+s*.6,y-s*.7,x+s*.62,y+s*.9);g.closePath();g.fill();}
function thumb(w,Wd=300,Ht=400){const k=w.id+w.title+Wd+'x'+Ht;if(TH[k])return TH[k];const cv=document.createElement('canvas');cv.width=Wd;cv.height=Ht;const g=cv.getContext('2d'),r=rnd(w.id);
 const gr=g.createLinearGradient(0,0,0,Ht);gr.addColorStop(0,w.pal[0]);gr.addColorStop(1,w.pal[1]);g.fillStyle=gr;g.fillRect(0,0,Wd,Ht);motif(g,w,Wd,Ht,r);
 figure(g,Wd*.5,Ht*.86,Wd*.17,'rgba(10,12,11,.82)');
 const sh=g.createLinearGradient(0,Ht*.55,0,Ht);sh.addColorStop(0,'rgba(0,0,0,0)');sh.addColorStop(1,'rgba(0,0,0,.6)');g.fillStyle=sh;g.fillRect(0,Ht*.55,Wd,Ht*.45);
 g.fillStyle='#fff';g.textAlign='center';g.textBaseline='alphabetic';let fs=Wd*(w.title.length>6?.12:.17);g.font=`${fs}px "Black Han Sans","Apple SD Gothic Neo",sans-serif`;

 words.forEach((t,i)=>g.fillText(t,Wd/2,Ht*.93-(words.length-1-i)*fs*1.1));
 return TH[k]=cv.toDataURL('image/jpeg',.86);}

function cutCanvas(w,n,i){const r=rnd(w.id+n+'-'+i);const Wd=690,Ht=[560,720,620,860,640,760,600][i%7];const cv=document.createElement('canvas');cv.width=Wd;cv.height=Ht;const g=cv.getContext('2d');

 const people=(i%3===1)?2:1;for(let p=0;p<people;p++){const x=people===1?Wd*(.3+r()*.4):Wd*(.3+p*.4),s=Wd*(i%4===3?.2:.12);figure(g,x,Ht*(.78+r()*.06),s,'rgba(10,12,11,.85)');}

 else if(t.dataset.rate){S.myRate[CUR.id+CUR.n]=+t.dataset.rate;const st=t.parentNode.querySelectorAll('button');st.forEach((b,i)=>{b.classList.toggle('on',i<+t.dataset.rate);b.setAttribute('aria-checked',i+1===+t.dataset.rate);});toast(`별점 ${t.dataset.rate*2}점을 줬어요`);}
 else if(t.dataset.like){t.querySelector('span').textContent=(+t.querySelector('span').textContent+1);t.disabled=true;}
 else if(t.dataset.report){toast('신고를 접수했어요 · 운영팀이 확인해요');}
 else if(t.hasAttribute('data-next')){collect();if(S.pub.step===1&&!S.pub.eps.length)return;S.pub.step++;render();}
 else if(t.hasAttribute('data-prev')){collect();S.pub.step--;render();}
 else if(t.hasAttribute('data-go')){collect();const P=S.pub,src=MY.find(m=>m.id===P.src);const id='my-'+Date.now().toString(36);
  FREE.unshift({id,title:P.title||'제목 없음',author:'손금왕',genre:P.genre,rate:0,eps:P.eps.length,ai:P.ai==='yes'?1:0,pal:src.pal,motif:src.motif,isNew:1,free:1,age:P.age==='전체'?'전체':P.age,desc:P.desc,days:P.days});
  P.newId=id;P.step=5;render();}
});
document.addEventListener('change',e=>{const t=e.target;const P=S.pub;
 if(t.name==='src'){P.src=t.value;const m=MY.find(x=>x.id===t.value);P.title=m.title;P.eps=m.eps.filter(x=>x[2]).map(x=>x[0]);render();}
 else if(t.dataset.ep){const n=+t.dataset.ep;P.eps=t.checked?[...new Set(P.eps.concat(n))]:P.eps.filter(x=>x!==n);const nb=$('[data-next]');if(nb)nb.disabled=!P.eps.length;}
 else if(t.dataset.ag){P.agree[+t.dataset.ag]=t.checked;const g=$('[data-go]');if(g)g.disabled=!P.agree.every(Boolean);}
 else if(t.name==='mode'){collect();render();}
});
document.addEventListener('submit',e=>{if(e.target.id!=='cmForm')return;e.preventDefault();const v=$('#cmIn').value.trim();if(!v)return;const key=CUR.id+CUR.n;S.cm[key].splice(2,0,{u:'나',t:v,up:0,d:'방금'});render();setTimeout(()=>{const c=document.querySelector('.cmts');c&&c.scrollIntoView({block:'start'});},0);toast('댓글을 남겼어요');});
function collect(){const P=S.pub;const v=id=>{const e=$(id);return e?e.value:null;};
 if($('#pTitle')){P.title=v('#pTitle').trim();P.genre=v('#pGenre');P.desc=v('#pDesc');const a=document.querySelector('input[name=age]:checked');if(a)P.age=a.value;}
 if(document.querySelector('input[name=mode]')){P.mode=document.querySelector('input[name=mode]:checked').value;P.days=[...document.querySelectorAll('input[name=day]:checked')].map(x=>x.value);P.ai=document.querySelector('input[name=ai]:checked').value;}}

(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{for(const k in TH)delete TH[k];render();});
render();
</script>

</body>
</html>
