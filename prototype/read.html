<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<style>:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>바로웹툰 연재</title>
<meta name="description" content="바로웹툰에서 만든 웹툰을 요일연재 · 자유연재로 읽는 곳">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 레이아웃: 독자용 연재관 — 어두운 바탕, 큰 추천 화면 → 옆으로 넘기는 줄(이어 보기 · TOP 10 · 주제별) → 요일 시간표(포스터 격자). 작품 · 세로 뷰어 · 연재하기는 주소로 바꿔 보여 줘요 */
:root{
  --bg:#121212;--surface:#181818;--surface-2:#2a2a2a;--ink:#ffffff;--ink-2:#b3b3b3;--ink-3:#7c7c7c;--line:#2a2a2a;
  --green:#1ed760;--green-soft:#12301c;--on-green:#000000;--red:#f2555a;--amber:#f5b54a;--blue:#7ea4f0;
  --f-body:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-display:var(--f-body);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body);-webkit-font-smoothing:antialiased;word-break:keep-all}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
img,canvas{display:block;max-width:100%}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.muted{color:var(--ink-2)}
.tnum{font-variant-numeric:tabular-nums}

/* 상단 */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.gnb{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.gnb .wrap{display:flex;align-items:center;gap:18px;height:58px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:21px;letter-spacing:-.01em;white-space:nowrap}
.logo i{width:28px;height:28px;border-radius:50%;background:var(--green);display:grid;place-items:center}
.logo svg{width:15px;height:15px;stroke:var(--on-green)}
.logo small{font-family:var(--f-body);font-size:12px;font-weight:700;color:var(--green);margin-left:2px;align-self:flex-start;margin-top:4px}
.menu{display:flex;gap:2px;height:100%}
.menu a{display:flex;align-items:center;padding:0 12px;font-weight:700;color:var(--ink-3);white-space:nowrap}
.menu a:hover{color:var(--ink-2)}
.menu a.on{color:var(--ink)}
.gnb .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.btn.go{background:var(--green);border-color:var(--green);color:var(--on-green)}
.btn.big{padding:13px 22px;font-size:15px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.only-wide{display:inline-flex}
@media (max-width:760px){
  .gnb .wrap{height:auto;flex-wrap:wrap;gap:0 12px;padding-block:8px 0}
  .menu{order:3;width:100%;height:44px;overflow-x:auto}
  .menu a{padding:0 10px}
  .only-wide{display:none}
}

/* 홈 — 큰 추천 화면 */
.btn.play{background:#f2f4f2;border-color:#f2f4f2;color:#0b0d0c}

.btn.glass{background:rgba(255,255,255,.14);border-color:transparent;color:#f2f4f2;backdrop-filter:blur(6px)}

/* 옆으로 넘기는 줄 */
.row{margin-top:34px;min-width:0}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.sec-h h2{font-size:19px;letter-spacing:-.01em}
.sec-h small{color:var(--ink-3);font-size:12.5px;font-weight:500}
.sec-h a{margin-left:auto;font-size:13px;color:var(--ink-2);white-space:nowrap}
.sec-h a:hover{color:var(--ink)}
.railw{position:relative}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 6*12px)/7);gap:12px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;padding-bottom:4px;overscroll-behavior-x:contain}
.rail::-webkit-scrollbar{display:none}
.rail>*{scroll-snap-align:start;min-width:0}
.rail.wide{grid-auto-columns:calc((100% - 4*12px)/5)}
.rail.top{grid-auto-columns:calc((100% - 4*12px)/5)}
@media (max-width:1180px){.rail{grid-auto-columns:calc((100% - 4*12px)/5.3)}.rail.wide,.rail.top{grid-auto-columns:calc((100% - 2*12px)/3.3)}}
@media (max-width:760px){.rail{grid-auto-columns:calc((100% - 2*10px)/3.25);gap:10px}.rail.wide{grid-auto-columns:calc((100% - 10px)/1.7)}.rail.top{grid-auto-columns:calc((100% - 10px)/1.9)}}
.railb{position:absolute;top:0;bottom:4px;width:44px;border:0;color:#fff;display:none;place-items:center;z-index:2;background:linear-gradient(90deg,rgba(11,13,12,.9),rgba(11,13,12,0))}
.railb.r{right:0;background:linear-gradient(270deg,rgba(11,13,12,.9),rgba(11,13,12,0))}
.railb.l{left:0}
@media (hover:hover) and (min-width:761px){.railw:hover .railb{display:grid}.railb[disabled]{display:none!important}}

/* 포스터 카드 — 제목은 그림 위에 */
.card{display:grid;gap:6px;min-width:0}
.card .th{position:relative;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:var(--surface-2);max-width:100%;transition:transform .18s ease,box-shadow .18s ease}
.card .th img{transition:transform .3s ease}
@media (hover:hover){.card:hover .th{box-shadow:0 0 0 2px var(--ink)}.card:hover .th img{transform:scale(1.04)}}
.badges{position:absolute;left:6px;top:6px;display:flex;gap:4px;flex-wrap:wrap}
.bd{font-size:10.5px;font-weight:700;line-height:1;padding:4px 6px;border-radius:5px;background:rgba(10,12,11,.72);color:#fff}
.bd.up{background:var(--red)}
.bd.new{background:var(--green);color:var(--on-green)}
.bd.ai{background:rgba(255,255,255,.92);color:#151916}
.bd.free{background:#f5c542;color:#1c1500}
.card .meta{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--ink-2);min-width:0;padding:0 2px}
.card .meta span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.star{color:var(--amber);font-weight:700;flex:none}
.empty{padding:48px 0;text-align:center;color:var(--ink-2)}

/* 이어 보기 */
.cont{display:grid;gap:8px;min-width:0}
.cont .th{position:relative;aspect-ratio:16/10;border-radius:10px;overflow:hidden;background:var(--surface-2)}
.cont .bar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.22)}
.cont .bar i{display:block;height:100%;background:var(--green)}
.cont .go{position:absolute;right:8px;bottom:12px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.6);display:grid;place-items:center;color:#fff}
.cont b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.cont small{color:var(--ink-2);font-size:12.5px}

/* TOP 10 — 큰 숫자 + 포스터 */
.topi{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1fr);align-items:end;min-width:0}
.topi .n{font-weight:800;font-size:clamp(84px,11vw,150px);line-height:.78;color:transparent;-webkit-text-stroke:2px #59615c;text-align:right;margin-right:-.12em;letter-spacing:-.06em;user-select:none}
.topi:hover .n{-webkit-text-stroke-color:var(--ink)}
.topi .th{position:relative;aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:var(--surface-2);z-index:1}

/* 시간표 */
.tt{margin-top:44px}
.days{display:flex;justify-content:center;gap:clamp(2px,1.6vw,18px);overflow-x:auto;scrollbar-width:none;margin-bottom:12px}
.days::-webkit-scrollbar{display:none}
.days button{flex:none;border:0;background:none;padding:8px 10px;font-weight:800;font-size:19px;color:var(--ink-3);position:relative;white-space:nowrap}
.days button:hover{color:var(--ink-2)}
.days button.on{color:var(--ink)}
.days button.on::after{content:"";position:absolute;left:10px;right:10px;bottom:2px;height:3px;border-radius:2px;background:var(--ink)}
.days button .today{position:absolute;top:4px;right:2px;width:6px;height:6px;border-radius:50%;background:var(--green)}
.chipsbar{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.fchip{border:0;border-radius:10px;padding:8px 14px;font-weight:700;font-size:13.5px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.fchip.on{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:18px 12px}
@media (max-width:1180px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media (max-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 8px}.days{justify-content:flex-start}.days button{font-size:17px;padding:8px 9px}}

/* 만들기 안내 띠 */
.band{margin-top:48px;border-radius:20px;padding:clamp(22px,4vw,40px);display:flex;gap:18px 28px;align-items:center;flex-wrap:wrap;background:radial-gradient(120% 160% at 0% 0%,#1d5a36 0%,#11301f 46%,#151917 100%)}
.band h3{font-weight:800;font-size:clamp(24px,3.4vw,34px);line-height:1.15}
.band p{color:#c2cbc5;margin-top:6px;max-width:56ch}
.band>div:first-child{flex:1 1 320px;min-width:0}
.band .acts{display:flex;gap:8px;flex-wrap:wrap}

/* 랭킹 */
.rank{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.rank li a{display:grid;grid-template-columns:54px 60px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 12px;border-radius:12px}
.rank li a:hover{background:var(--surface)}
.rank .n{font-weight:800;font-size:34px;line-height:1;text-align:center;color:var(--ink-3)}
.rank li:nth-child(-n+3) .n{color:var(--green)}
.rank .mini{width:60px;aspect-ratio:2/3;border-radius:6px;overflow:hidden;background:var(--surface-2)}
.rank b{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank small{color:var(--ink-2);font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .r{color:var(--amber);font-weight:700;font-size:14px;white-space:nowrap}
@media (max-width:520px){.rank li a{grid-template-columns:34px 48px minmax(0,1fr);gap:10px;padding:8px 4px}.rank .n{font-size:26px}.rank .mini{width:48px}.rank .r{display:none}}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.notice{margin-top:16px;font-size:13px;color:var(--ink-2);display:flex;gap:6px;align-items:flex-start}
.page-h{padding-block:26px 6px}
.page-h h1{font-weight:800;font-size:clamp(28px,4vw,40px)}
.page-h p{color:var(--ink-2);margin-top:4px;font-size:14px}

/* 작품 페이지 */
.thead{display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;padding-block:28px 22px;align-items:start}
.thead .th{aspect-ratio:2/3;border-radius:12px;overflow:hidden;max-width:100%}
.thead .th canvas{width:100%;height:100%}
.thead h1{font-weight:800;font-size:36px;line-height:1.15}
.thead .who{margin-top:6px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 12px;font-size:14px}
.thead .desc{margin-top:14px;max-width:62ch}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.chip{font-size:12.5px;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}
.chip.ai{border-color:var(--blue);color:var(--blue)}
.thead .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.fav.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
@media (max-width:640px){.thead{grid-template-columns:96px minmax(0,1fr);gap:4px 16px;padding-block:20px 18px}.thead>div:last-child{display:contents}.thead .th{grid-row:1/3}.thead h1{font-size:26px;grid-column:2;grid-row:1;align-self:end}.thead .who{grid-column:2;grid-row:2;align-self:start}.thead .desc,.thead .chips,.thead .acts{grid-column:1/-1}.thead .desc{margin-top:16px}}
.eplist{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:40px}
.eplist .hd{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);font-size:14px}
.eplist .hd b{font-size:15px}
.eplist .hd button{margin-left:auto;border:0;background:none;color:var(--ink-2);font-size:13px}
.ep{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line)}
.ep:last-child{border-bottom:0}
.ep:hover{background:color-mix(in srgb,var(--bg) 60%,var(--surface))}
.ep .eth{aspect-ratio:16/10;border-radius:6px;overflow:hidden;max-width:100%}
.ep .eth canvas{width:100%;height:100%}
.ep b{display:block;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ep small{color:var(--ink-2);font-size:12.5px}
.ep .d{font-size:12.5px;color:var(--ink-3);text-align:right}
@media (max-width:520px){.ep{grid-template-columns:80px minmax(0,1fr)}.ep .d{display:none}}

/* 뷰어 */
.vbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--surface);border-bottom:1px solid var(--line)}
.vbar .wrap{display:flex;align-items:center;gap:10px;height:54px;max-width:820px}
.vbar .t{min-width:0;flex:1}
.vbar .t b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbar .t small{color:var(--ink-2);font-size:12.5px}
.ibtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.ibtn[disabled]{opacity:.35;cursor:not-allowed}
.strip{max-width:690px;margin:0 auto;background:#fff;color-scheme:light}
.cutv{position:relative}
.cutv canvas{width:100%;height:auto}
.bal{position:absolute;max-width:62%;background:#fff;color:#151916;border:2px solid #151916;border-radius:22px;padding:10px 16px;font-size:clamp(13px,2.4vw,17px);font-weight:500;line-height:1.45;text-align:center}
.bal.nar{border-radius:3px;background:#151916;color:#f2f2f2;border-color:#151916}
.bal.sh{border-width:3px;font-weight:700}
.after{max-width:722px;margin:0 auto;padding-block:26px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
.after>*{min-width:0}
.amsg{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;gap:4px}
.amsg small{color:var(--ink-2);font-weight:700;font-size:12.5px}
.rate{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:10px;justify-items:center;text-align:center}
.stars{display:flex;gap:4px}
.stars button{border:0;background:none;padding:2px;font-size:30px;line-height:1;color:var(--line)}
.stars button.on{color:var(--amber)}
.navep{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.navep a{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:2px;min-width:0}
.navep a small{color:var(--ink-2);font-size:12.5px}
.navep a b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navep a.next{text-align:right;border-color:var(--green)}
.navep a[aria-disabled="true"]{opacity:.4;pointer-events:none}
.cmts{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px}
.cmts,.amsg{grid-template-columns:minmax(0,1fr)}
.cmts form{display:flex;gap:8px;min-width:0}
.cmts input{width:0}
.cmts input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit}
.cmt{display:grid;gap:3px;padding-top:12px;border-top:1px solid var(--line)}
.cmt .h{display:flex;gap:8px;align-items:center;font-size:13px}
.cmt .h b{font-size:13.5px}
.cmt .best{font-size:11px;font-weight:700;color:var(--red);border:1px solid var(--red);border-radius:4px;padding:1px 5px}
.cmt .h span{color:var(--ink-3)}
.cmt .f{display:flex;gap:12px;font-size:12.5px;color:var(--ink-2)}
.cmt .f button{border:0;background:none;padding:0;color:var(--ink-2);font-size:12.5px}

/* 연재하기 */
.pub{max-width:860px;margin:0 auto;padding-block:28px 60px}
.pub h1{font-size:26px}
.steps{display:flex;gap:6px;margin:18px 0 22px;flex-wrap:wrap}
.steps span{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;color:var(--ink-3);padding:6px 12px 6px 6px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.steps span i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--ink-2);font-size:12px}
.steps span.on{color:var(--ink);border-color:var(--ink)}
.steps span.on i{background:var(--ink);color:var(--surface)}
.steps span.done i{background:var(--green);color:var(--on-green)}
@media (max-width:520px){.steps{flex-wrap:nowrap;gap:4px}.steps span:not(.on){padding-right:6px;font-size:0;gap:0}.steps span:not(.on) i{font-size:12px}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;display:grid;gap:18px}
.panel h2{font-size:18px}
.field{display:grid;gap:6px}
.field label,.field .lb{font-weight:700;font-size:14px}
.field small{color:var(--ink-2);font-size:12.5px}
.field input[type=text],.field textarea,.field select{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;width:100%}
.field textarea{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:640px){.two{grid-template-columns:1fr}.panel{padding:18px}}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:500;cursor:pointer;background:var(--bg)}
.seg input{accent-color:var(--green)}
.seg label:has(input:checked){border-color:var(--green);background:var(--green-soft)}
.src{display:grid;gap:10px}
.srcw{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;background:var(--bg)}
.srcw:has(input:checked){border-color:var(--green);background:var(--green-soft)}
.srcw .mini{aspect-ratio:2/3;border-radius:6px;overflow:hidden}
.srcw .mini canvas{width:100%;height:100%}
.srcw small{color:var(--ink-2);font-size:12.5px}
.eps{display:grid;gap:6px}
.eprow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.eprow input{accent-color:var(--green);width:18px;height:18px}
.eprow small{color:var(--ink-2)}

const PATH=/^\/read(\/|$)/.test(location.pathname);
function U(p){return PATH?'/read'+(p?'/'+p:''):'#'+(p?'r-'+p.split('/').join('--'):'home');}
function segs(){if(PATH)return location.pathname.replace(/^\/read\/?/,'').split('/').filter(Boolean).map(decodeURIComponent);const h=location.hash.slice(1);return h.startsWith('r-')?h.slice(2).split('--'):[];}
let CUR={};

 if(g[0]==='daily'){html=daily();m='daily';}else if(g[0]==='free'){html=free();m='free';}else if(g[0]==='rank'){html=rank();m='rank';}
 else if(g[0]==='publish'){html=publish();}

 else if(g.length>=2){CUR={id:g[0],n:Math.max(1,+g[1]||1)};html=viewer(g[0],CUR.n);}
 else{html=home();m='home';}
 $('#app').innerHTML=html;document.querySelectorAll('.menu a').forEach(a=>a.classList.toggle('on',a.dataset.m===m));
 $('#gnb').hidden=g.length>=2&&!['daily','free','rank','publish'].includes(g[0]);
 const w=g[0]&&byId(g[0]);document.title=w?(g[1]?`${w.title} ${g[1]}화 · 바로웹툰 연재`:`${w.title} · 바로웹툰 연재`):'바로웹툰 연재';
 window.scrollTo(0,0);}
function go(p){if(PATH){history.pushState(null,'',p);render();}else location.hash=p;}
window.addEventListener(PATH?'popstate':'hashchange',render);
/* 줄 양끝에 닿으면 넘김 단추를 숨겨요 */
document.addEventListener('scroll',e=>{const r=e.target;if(!r.classList||!r.classList.contains('rail'))return;const w=r.parentNode;w.querySelector('.railb.l').disabled=r.scrollLeft<8;w.querySelector('.railb.r').disabled=r.scrollLeft+r.clientWidth>r.scrollWidth-8;},true);
document.querySelectorAll('[data-l]').forEach(a=>a.setAttribute('href',U(a.dataset.l)));
if(!PATH)document.querySelectorAll('[data-make]').forEach(a=>{a.href='https://webtoon.iux.kr';a.target='_blank';a.rel='noopener';});
if(PATH)document.addEventListener('click',e=>{const a=e.target.closest('a[href^="/read"]');if(!a||e.metaKey||e.ctrlKey||e.shiftKey||e.button)return;e.preventDefault();if(a.getAttribute('href')!==location.pathname)go(a.getAttribute('href'));},true);

document.addEventListener('click',e=>{const t=e.target.closest('button,a');if(!t)return;

 else if(t.dataset.fav){const id=t.dataset.fav;S.fav.has(id)?S.fav.delete(id):S.fav.add(id);try{localStorage.setItem('wbs-fav',JSON.stringify([...S.fav]))}catch(e){}const on=S.fav.has(id);t.classList.toggle('on',on);t.setAttribute('aria-pressed',on);t.textContent=on?'관심 등록됨':'+ 관심';toast(on?'관심 작품에 넣었어요 · 새 회차가 올라오면 알려 드려요':'관심 작품에서 뺐어요');}
 else if(t.hasAttribute('data-share')){const u=location.href;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast('작품 주소를 복사했어요')).catch(()=>toast('주소창의 주소를 복사해 공유해 주세요'));}
 else if(t.dataset.rate){S.myRate[CUR.id+CUR.n]=+t.dataset.rate;const st=t.parentNode.querySelectorAll('button');st.forEach((b,i)=>{b.classList.toggle('on',i<+t.dataset.rate);b.setAttribute('aria-checked',i+1===+t.dataset.rate);});toast(`별점 ${t.dataset.rate*2}점을 줬어요`);}
 else if(t.dataset.like){t.querySelector('span').textContent=(+t.querySelector('span').textContent+1);t.disabled=true;}
 else if(t.dataset.report){toast('신고를 접수했어요 · 운영팀이 확인해요');}
 else if(t.hasAttribute('data-next')){collect();if(S.pub.step===1&&!S.pub.eps.length)return;S.pub.step++;render();}
 else if(t.hasAttribute('data-prev')){collect();S.pub.step--;render();}
 else if(t.hasAttribute('data-go')){collect();const P=S.pub,src=MY.find(m=>m.id===P.src);const id='my-'+Date.now().toString(36);
  FREE.unshift({id,title:P.title||'제목 없음',author:'손금왕',genre:P.genre,rate:0,eps:P.eps.length,ai:P.ai==='yes'?1:0,pal:src.pal,motif:src.motif,isNew:1,free:1,age:P.age==='전체'?'전체':P.age,desc:P.desc,days:P.days});
  P.newId=id;P.step=5;render();}
});
document.addEventListener('change',e=>{const t=e.target;const P=S.pub;
 if(t.name==='src'){P.src=t.value;const m=MY.find(x=>x.id===t.value);P.title=m.title;P.eps=m.eps.filter(x=>x[2]).map(x=>x[0]);render();}
 else if(t.dataset.ep){const n=+t.dataset.ep;P.eps=t.checked?[...new Set(P.eps.concat(n))]:P.eps.filter(x=>x!==n);const nb=$('[data-next]');if(nb)nb.disabled=!P.eps.length;}
 else if(t.dataset.ag){P.agree[+t.dataset.ag]=t.checked;const g=$('[data-go]');if(g)g.disabled=!P.agree.every(Boolean);}
 else if(t.name==='mode'){collect();render();}
});
document.addEventListener('submit',e=>{if(e.target.id!=='cmForm')return;e.preventDefault();const v=$('#cmIn').value.trim();if(!v)return;const key=CUR.id+CUR.n;S.cm[key].splice(2,0,{u:'나',t:v,up:0,d:'방금'});render();setTimeout(()=>{const c=document.querySelector('.cmts');c&&c.scrollIntoView({block:'start'});},0);toast('댓글을 남겼어요');});
function collect(){const P=S.pub;const v=id=>{const e=$(id);return e?e.value:null;};
 if($('#pTitle')){P.title=v('#pTitle').trim();P.genre=v('#pGenre');P.desc=v('#pDesc');const a=document.querySelector('input[name=age]:checked');if(a)P.age=a.value;}
 if(document.querySelector('input[name=mode]')){P.mode=document.querySelector('input[name=mode]:checked').value;P.days=[...document.querySelectorAll('input[name=day]:checked')].map(x=>x.value);P.ai=document.querySelector('input[name=ai]:checked').value;}}

(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{for(const k in TH)delete TH[k];render();});
render();
</script>

</body>
